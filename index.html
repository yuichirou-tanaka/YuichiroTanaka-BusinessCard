<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>田中雄一郎 - Business Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 名刺サイズ固定（角丸なし） */
    .card {
      width: 350px;
      height: 200px;
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 0; /* ← アールなし */
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);

      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      text-align: left;
    }

    /* 顔画像：3:4 比率（角丸なし） */
    .face {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 81px;   /* 横 */
      height: 108px;  /* 縦（3:4） */
      border-radius: 0; /* ← アールなし */
      object-fit: cover;
    }

    .name {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 10px 0 14px 0;
      text-align: left;
    }

    .title {
      font-size: 0.8rem;
      color: #555555;
      margin-bottom: 16px;
      padding-right: 10px;
    }

    .spacer {
      height: 36px; /* 3行ぶん */
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #777777;
      margin-bottom: 6px;
    }

    .item {
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">

    <img src="face.png" class="face" alt="face">

    <div class="title">
      Gameginatortiscosiner<br>
      ゲーム技術制作芸術作曲設計者
    </div>

    <div class="name">田中雄一郎</div>

    <div class="spacer"></div>

    <div class="section-title">Contact</div>

    <div class="item">
      Email: <a href="mailto:yuichiro_tanaka@outlook.jp">yuichiro_tanaka@outlook.jp</a>
    </div>

  </main>
</body>
</html>
