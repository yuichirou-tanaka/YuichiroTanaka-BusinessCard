<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>雄一郎 - Digital Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 24px 28px;
      max-width: 420px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    }
    .name {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .title {
      font-size: 0.95rem;
      color: #9ca3af;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .item {
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="name">田中雄一郎</div>
    <div class="title">ゲームジニエイターティスコザイナー / Gameginatortiscosiner = Game x Engineer x Artist x Composer x Designer </div> </div>

    <div class="section-title">Contact</div>
    <div class="item">Email: <a href="mailto:yuichiro_tanaka@outlook.jp">yuichiro_tanaka@outlook.jp</a></div>

  </main>
</body>
</html>
